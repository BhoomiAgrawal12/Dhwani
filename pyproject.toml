[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhwani"
version = "0.1.0"
description = "Automated blind analysis of .IQ/.WAV SDR recordings: detection, parameter estimation, modulation classification, demodulation, and blind bit-layer reconstruction (interleaver/FEC/frame/CRC identification)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "huggingface_hub>=0.20"]
gui = ["PyQt6>=6.6", "pyqtgraph>=0.13", "pytest-qt>=4.4"]
io = ["soundfile>=0.12"]
report = ["reportlab>=4.0"]
fec = ["reedsolo>=1.7"]
dev = ["pytest>=7.4"]
all = ["dhwani[ml,gui,io,report,fec,dev]"]

[project.scripts]
dhwani = "dhwani.cli:main"
dhwani-gui = "dhwani.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# bundled LDPC parity-check matrices (.qc / .alist) and their catalogue
"dhwani.fec" = ["codes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
